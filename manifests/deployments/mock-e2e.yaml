apiVersion: harness.nova/v1
kind: DeploymentProfile
metadata:
  id: mock-e2e
  displayName: 本地确定性 E2E
  description: Docker Compose 内的 GitLab/npm Mock，可替换为任意内网来源。
hub:
  url: http://hub-api:3200/api/v1
network:
  noProxy: [localhost, 127.0.0.1, mock-server, hub-api]
  rejectUnauthorized: true
downloads:
  allowedHosts: [mock-server, localhost]
  allowedRedirectHosts: []
  maxArchiveBytes: 10485760
  maxExtractedBytes: 52428800
  maxFiles: 2000
  allowLifecycleScripts: false
sources:
  - id: mock-gitlab
    displayName: Mock GitLab
    type: gitlab
    baseUrl: http://mock-server:3400
    rootGroup: nova
    skillGroupPath: skills
    pluginGroupPath: plugins
    recursive: true
    includeSharedProjects: false
  - id: mock-npm
    displayName: Mock npm
    type: npm
    registry: http://mock-server:3400
    adapter: npm-compatible
    scopes: ['@nova-cbb']
    packagePatterns: ['@nova-cbb/*']
    seedPackages: ['@nova-cbb/mock-mcp']
runtime:
  default: claude-code
  mode: isolated
trust:
  allowUnreviewed: false
  allowedMaintainerTeams: []
  requireApprovalAt: high
