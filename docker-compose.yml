services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nova_harness
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nova -d nova_harness']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - nova-postgres:/var/lib/postgresql/data

  mock-server:
    build: .
    image: nova-harness:local
    command: ['node', 'apps/mock-server/dist/server.js']
    environment:
      NOVA_MOCK_PORT: 3400
      NOVA_MOCK_ORIGIN: http://mock-server:3400
    ports:
      - '3400:3400'
    healthcheck:
      # Alpine 的 localhost 可能优先解析到 ::1，而服务显式监听 IPv4；固定回环地址避免误判不健康。
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3400/health']
      interval: 5s
      timeout: 3s
      retries: 20

  hub-api:
    image: nova-harness:local
    command:
      ['sh', '-c', 'pnpm prisma:migrate && pnpm prisma:seed && node apps/hub-api/dist/main.js']
    environment:
      DATABASE_URL: postgresql://nova:nova@postgres:5432/nova_harness?schema=public
      NOVA_HUB_PORT: 3200
      NOVA_HUB_DEV_TOKEN: local-development-only
      NOVA_HUB_AUTH_ENABLED: 'false'
      NOVA_DEPLOYMENT_CONFIG: /app/manifests/deployments/mock-e2e.yaml
    ports:
      - '3200:3200'
    depends_on:
      postgres:
        condition: service_healthy
      mock-server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3200/api/v1/health']
      interval: 5s
      timeout: 3s
      retries: 20

  hub-admin:
    image: nova-harness:local
    command: ['pnpm', '--filter', '@nova-cbb/hub-admin', 'preview']
    environment:
      NOVA_HUB_PROXY: http://hub-api:3200
    ports:
      - '3210:3210'
    depends_on:
      hub-api:
        condition: service_healthy

volumes:
  nova-postgres:
